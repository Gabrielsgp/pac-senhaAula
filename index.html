<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAC-SENHA CO-OP V5.0 — Linux Educacional</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -moz-user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #050814;
      color: #ffffff;
      font-family: "DejaVu Sans", "Liberation Sans", Arial, Helvetica, sans-serif;
      min-height: 100vh;
      padding: 8px;
      text-align: center;
    }

    .top-brand {
      width: 100%;
      max-width: 980px;
      margin: 0 auto 8px auto;
      background-color: #0d1530;
      border: 3px solid #00e5ff;
      border-radius: 8px;
      padding: 8px 14px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      text-align: left;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: bold;
      color: #ffea00;
    }

    .brand-subtitle {
      font-size: 0.82rem;
      color: #80d8ff;
    }

    .screen {
      display: none;
      width: 100%;
      max-width: 980px;
      margin: 0 auto;
      background-color: #0f172a;
      border: 3px solid #3949ab;
      border-radius: 8px;
      padding: 14px;
      text-align: left;
    }

    .screen.active {
      display: block;
    }

    .panel-title {
      font-size: 1.3rem;
      color: #00e5ff;
      text-align: center;
      margin-bottom: 12px;
      border-bottom: 2px solid #283593;
      padding-bottom: 8px;
    }

    .section-label {
      display: block;
      font-size: 1rem;
      font-weight: bold;
      color: #ffea00;
      margin: 10px 0 6px 0;
    }

    .selector-grid {
      display: flex;
      flex-wrap: wrap;
      margin: -4px;
      margin-bottom: 8px;
    }

    .choice-btn {
      flex: 1 1 170px;
      margin: 4px;
      background-color: #1e293b;
      color: #ffffff;
      border: 3px solid #475569;
      border-radius: 8px;
      padding: 9px 8px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
    }

    .choice-btn:hover {
      background-color: #334155;
      border-color: #80d8ff;
    }

    .choice-btn.selected {
      background-color: #004d40;
      border-color: #00e676;
      color: #ffea00;
    }

    .btn {
      display: inline-block;
      margin: 4px;
      background-color: #1e293b;
      color: #ffffff;
      border: 3px solid #00e5ff;
      border-radius: 8px;
      padding: 9px 16px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:hover {
      background-color: #283593;
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-primary {
      background-color: #00c853;
      color: #050814;
      border-color: #b9f6ca;
      font-size: 1.15rem;
      padding: 11px 22px;
    }

    .btn-primary:hover {
      background-color: #00e676;
    }

    .btn-warning {
      background-color: #ff9100;
      color: #050814;
      border-color: #ffe082;
    }

    .btn-danger {
      background-color: #d50000;
      color: #ffffff;
      border-color: #ff8a80;
    }

    .btn-small {
      padding: 5px 10px;
      font-size: 0.88rem;
    }

    .visual-slots-bar {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      margin: 10px 0;
    }

    .password-slot {
      width: 115px;
      height: 64px;
      margin: 5px;
      background-color: #050814;
      border: 3px dashed #00e5ff;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #ffea00;
    }

    .password-slot.filled {
      border-style: solid;
      border-color: #00e676;
      background-color: #0b2418;
    }

    .blocks-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      margin: 8px -4px;
    }

    .block-card {
      width: 110px;
      margin: 4px;
      background-color: #1a237e;
      color: #ffffff;
      border: 2px solid #4fc3f7;
      border-radius: 8px;
      padding: 8px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
    }

    .block-card:hover {
      background-color: #283593;
      border-color: #ffea00;
    }

    .block-card.num-block {
      background-color: #4a148c;
      border-color: #ea80fc;
    }

    .text-password-wrap {
      text-align: center;
      margin: 12px 0;
    }

    .password-input {
      background-color: #050814;
      color: #ffea00;
      border: 3px solid #00e5ff;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 1.25rem;
      font-weight: bold;
      width: 280px;
      text-align: center;
      margin: 4px;
    }

    .diagnosis-box {
      border-radius: 8px;
      padding: 14px;
      margin-top: 12px;
      text-align: center;
      border: 3px solid #ffffff;
    }

    .diagnosis-blocked { background-color: #3e0a14; border-color: #ff1744; }
    .diagnosis-weak { background-color: #4a1c00; border-color: #ff9100; }
    .diagnosis-medium { background-color: #3e3500; border-color: #ffea00; }
    .diagnosis-strong { background-color: #063b20; border-color: #00e676; }

    .hud-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      background-color: #080d1e;
      border: 2px solid #3949ab;
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 8px;
    }

    .hud-item {
      margin: 4px 8px;
    }

    .hud-label {
      font-size: 0.85rem;
      color: #80d8ff;
      font-weight: bold;
      display: block;
    }

    .hud-value {
      font-size: 1.2rem;
      font-weight: bold;
      color: #ffea00;
    }

    .timer-bar-outer {
      width: 200px;
      height: 14px;
      background-color: #1e293b;
      border: 2px solid #ffffff;
      border-radius: 6px;
      overflow: hidden;
      margin-top: 4px;
    }

    .timer-bar-inner {
      height: 100%;
      width: 100%;
      background-color: #00e676;
    }

    .canvas-container {
      width: 100%;
      text-align: center;
      background-color: #03050c;
      border: 3px solid #00e5ff;
      border-radius: 8px;
      padding: 6px;
    }

    canvas {
      background-color: #050814;
      max-width: 100%;
      height: auto;
      display: inline-block;
      cursor: pointer;
    }

    .controls-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 8px;
      font-size: 0.9rem;
      color: #b3e5fc;
      background-color: #080d1e;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #283593;
    }

    .onscreen-dpad {
      display: inline-block;
      margin: 2px 4px;
    }

    .dpad-btn {
      background-color: #1e293b;
      color: #ffea00;
      border: 2px solid #00e5ff;
      border-radius: 6px;
      padding: 4px 10px;
      margin: 0 2px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.95rem;
    }

    .dpad-btn:hover, .dpad-btn:active {
      background-color: #00e676;
      color: #000000;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(3, 6, 18, 0.92);
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 740px;
      background-color: #0f172a;
      border: 4px solid #ffea00;
      border-radius: 10px;
      padding: 16px;
      max-height: 95vh;
      overflow-y: auto;
      text-align: left;
    }

    .modal-header {
      font-size: 1.3rem;
      font-weight: bold;
      color: #ffea00;
      text-align: center;
      margin-bottom: 10px;
      border-bottom: 2px solid #334155;
      padding-bottom: 6px;
    }

    .question-badge {
      display: inline-block;
      background-color: #00e5ff;
      color: #050814;
      font-weight: bold;
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 0.95rem;
      margin: 4px;
    }

    .question-text {
      font-size: 1.3rem;
      font-weight: bold;
      color: #ffffff;
      background-color: #050814;
      border: 2px solid #3949ab;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
      text-align: center;
      line-height: 1.4;
    }

    .option-btn {
      width: 100%;
      margin-bottom: 8px;
      background-color: #1e293b;
      color: #ffffff;
      border: 3px solid #64b5f6;
      border-radius: 8px;
      padding: 11px 14px;
      font-size: 1.15rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      text-align: left;
    }

    .option-btn:hover {
      background-color: #283593;
      border-color: #ffea00;
    }

    .option-btn.correct {
      background-color: #064e28;
      border-color: #00e676;
      color: #b9f6ca;
    }

    .option-btn.wrong {
      background-color: #5c0c16;
      border-color: #ff5252;
      color: #ffcdd2;
    }

    .key-hint {
      background-color: #ffea00;
      color: #050814;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      display: inline-block;
      line-height: 32px;
      text-align: center;
      font-weight: bold;
      margin-right: 12px;
      flex-shrink: 0;
    }

    .report-grid {
      display: flex;
      flex-wrap: wrap;
      margin: 10px -4px;
    }

    .report-card {
      flex: 1 1 180px;
      margin: 4px;
      background-color: #080d1e;
      border: 2px solid #3949ab;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }

    .report-card-title {
      font-size: 0.88rem;
      color: #80d8ff;
      margin-bottom: 6px;
    }

    .report-card-value {
      font-size: 1.3rem;
      font-weight: bold;
      color: #ffea00;
    }

    body.projector-green {
      background-color: #000000 !important;
      color: #ffffff !important;
    }

    body.projector-green .top-brand,
    body.projector-green .screen,
    body.projector-green .hud-bar,
    body.projector-green .canvas-container,
    body.projector-green .controls-footer,
    body.projector-green .modal-card,
    body.projector-green .report-card,
    body.projector-green .question-text {
      background-color: #000000 !important;
      border-color: #ffff00 !important;
      border-width: 4px !important;
      color: #ffffff !important;
    }

    body.projector-green .panel-title,
    body.projector-green .brand-title,
    body.projector-green .section-label,
    body.projector-green .hud-value,
    body.projector-green .modal-header {
      color: #ffff00 !important;
    }

    body.projector-green .choice-btn,
    body.projector-green .btn,
    body.projector-green .option-btn,
    body.projector-green .block-card {
      background-color: #000000 !important;
      color: #ffffff !important;
      border: 3px solid #ffffff !important;
      font-weight: bold !important;
    }

    body.projector-green .choice-btn.selected,
    body.projector-green .btn-primary,
    body.projector-green .option-btn.correct {
      background-color: #ffff00 !important;
      color: #000000 !important;
      border: 3px solid #ffffff !important;
    }

    #toastBanner {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #00b0ff;
      color: #ffffff;
      font-weight: bold;
      padding: 10px 20px;
      border-radius: 8px;
      border: 2px solid #ffffff;
      display: none;
      z-index: 1200;
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <header class="top-brand">
    <div>
      <div class="brand-title">
